name: roaster

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       roaster
      POSTGRES_USER:     roaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - roaster-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaster -d roaster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - roaster-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.migration
    environment:
      MIGRATION_CONNECTION_STRING: >-
        Host=postgres;Database=roaster;Username=roaster;Password=${POSTGRES_PASSWORD:-changeme}
    networks:
      - roaster-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

networks:
  roaster-net:
    name: roaster-net

volumes:
  postgres_data:
