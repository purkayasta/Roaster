name: roaster

services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB:       roaster
      POSTGRES_USER:     roaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roaster -d roaster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  migration:
    build:
      context: .
      dockerfile: docker/Dockerfile.migration
    environment:
      MIGRATION_CONNECTION_STRING: >-
        Host=postgres;Database=roaster;Username=roaster;Password=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  roaster-consumer:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer
    environment:
      ConnectionStrings__Postgres: >-
        Host=postgres;Database=roaster;Username=roaster;Password=${POSTGRES_PASSWORD:-changeme}
      RabbitMQ__Uri: "rabbitmq://guest:${RABBITMQ_PASSWORD:-guest}@rabbitmq"
      Ollama__Endpoint: "http://host.docker.internal:11434"
      Ollama__ModelId: "qwen2.5-coder:7b"
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  roaster-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Postgres: >-
        Host=postgres;Database=roaster;Username=roaster;Password=${POSTGRES_PASSWORD:-changeme}
      RabbitMQ__Uri: "rabbitmq://guest:${RABBITMQ_PASSWORD:-guest}@rabbitmq"
      Cors__Origins__0: "http://localhost:5094"
    depends_on:
      roaster-consumer:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  roaster-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5094:80"
    depends_on:
      roaster-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
