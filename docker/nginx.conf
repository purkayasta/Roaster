server {
    listen 80;

    # Blazor WASM framework files must never fall back to index.html —
    # a missing file should 404 so the browser sees the real error.
    location /_framework/ {
        root /usr/share/nginx/html;
        try_files $uri =404;

        types {
            text/javascript      js mjs;
            application/wasm     wasm;
            application/octet-stream blat dat pdb;
        }
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
